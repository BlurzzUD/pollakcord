[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pollakcord-bot"
version = "0.1.0"
description = "Async client for user-hosted PollákCord bots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "websockets>=15,<18"]

[tool.setuptools.packages.find]
where = ["src"]
